<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modern System 5 PDF</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; padding: 20px; }
        #container { max-width: 100%; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: #333; }
        #pdf-viewer { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        canvas { display: block; margin: 20px auto; max-width: 100%; border: 1px solid #ddd; }
        #controls { text-align: center; margin: 20px 0; }
        button { padding: 10px 20px; margin: 0 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #0056b3; }
        #page-info { text-align: center; margin: 10px 0; color: #666; }
        .error { color: red; text-align: center; padding: 20px; }
        .loading { text-align: center; padding: 20px; color: #666; }
    </style>
</head>
<body>
    <div id="container">
        <h1>Modern System 5 PDF</h1>
        <div id="loading" class="loading">Loading PDF...</div>
        <div id="pdf-viewer" style="display:none;">
            <div id="controls">
                <button id="prev-btn">← Previous</button>
                <span id="page-info">Page <span id="current-page">1</span> of <span id="total-pages">0</span></span>
                <button id="next-btn">Next →</button>
            </div>
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div id="error" class="error" style="display:none;"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const url = 'https://raw.githubusercontent.com/c2610408/keben/main/modernsystem5.pdf';
        let pdfDoc = null;
        let currentPage = 1;

        async function loadPDF() {
            try {
                pdfDoc = await pdfjsLib.getDocument(url).promise;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('pdf-viewer').style.display = 'block';
                document.getElementById('total-pages').textContent = pdfDoc.numPages;
                renderPage(currentPage);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading PDF: ' + error.message;
            }
        }

        async function renderPage(pageNum) {
            if (pageNum < 1 || pageNum > pdfDoc.numPages) return;
            
            const page = await pdfDoc.getPage(pageNum);
            const canvas = document.getElementById('pdf-canvas');
            const context = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 1.5 });
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            
            currentPage = pageNum;
            document.getElementById('current-page').textContent = currentPage;
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentPage > 1) renderPage(currentPage - 1);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
        });

        loadPDF();
    </script>
</body>
</html>
