<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modern System 5 PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #222; color: white; }
        #container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; }
        #controls { text-align: center; margin: 20px 0; }
        button { padding: 10px 20px; margin: 0 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #page-info { text-align: center; margin: 10px 0; }
        #canvas { display: block; margin: 20px auto; max-width: 100%; border: 1px solid #555; background: white; }
        .error { color: red; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div id="container">
        <h1>Modern System 5 PDF</h1>
        <div id="controls">
            <button id="prev">← 上一页</button>
            <span id="page-info">第 <span id="current">1</span> 页，共 <span id="total">0</span> 页</span>
            <button id="next">下一页 →</button>
        </div>
        <canvas id="canvas"></canvas>
        <div id="error" class="error"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let currentPage = 1;
        const pdfUrl = 'https://github.com/c2610408/keben/releases/download/1.0/modernsystem5.pdf';

        async function loadPdf() {
            try {
                const response = await fetch(pdfUrl);
                const blob = await response.blob();
                const arrayBuffer = await blob.arrayBuffer();
                pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                document.getElementById('total').textContent = pdfDoc.numPages;
                renderPage(1);
            } catch (error) {
                document.getElementById('error').textContent = '错误: ' + error.message;
            }
        }

        async function renderPage(num) {
            if (!pdfDoc || num < 1 || num > pdfDoc.numPages) return;
            const page = await pdfDoc.getPage(num);
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport }).promise;
            currentPage = num;
            document.getElementById('current').textContent = num;
        }

        document.getElementById('prev').addEventListener('click', () => {
            if (currentPage > 1) renderPage(currentPage - 1);
        });

        document.getElementById('next').addEventListener('click', () => {
            if (currentPage < pdfDoc.numPages) renderPage(currentPage + 1);
        });

        loadPdf();
    </script>
</body>
</html>
